[package]
name = "lexit-statement"
description = "The hub's statement: that a user's exit claim, citing her returns of L-BTC on Liquid, is false"
# self-contained (not inherited from the workspace): the statement guest
# builds it alone
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
lexit-elements = { path = "../elements" }
sha2 = { version = "0.10", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["alloc", "arithmetic"] }
