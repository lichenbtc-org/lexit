[workspace]
resolver = "2"
exclude = ["r0"]
members = ["crates/elements", "crates/statement", "crates/proto", "crates/hub", "crates/wallet"]

[workspace.package]
# liquid-lichen's own (its crates' versions are in the guest's ELF, so its
# image id: a change here is a new deployment)
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
bitcoin = { version = "0.32", features = ["serde"] }
bitcoincore-rpc = "0.19"
clap = { version = "4", features = ["derive"] }
# rust-elements: Liquid's transactions, addresses (blech32), confidential
# outputs (host side only: the guest reads Liquid with
# liquid-lichen-elements)
elements = "0.27"
getrandom = "0.2"
hex = "0.4"
k256 = { version = "0.13", default-features = false, features = ["alloc", "ecdsa", "schnorr", "expose-field"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
liquid-lichen-elements = { path = "crates/elements" }
liquid-lichen-statement = { path = "crates/statement" }
liquid-lichen-proto = { path = "crates/proto" }
liquid-lichen-hub = { path = "crates/hub" }
liquid-lichen-wallet = { path = "crates/wallet" }
# lichen, the base (lichenbtc-org/lichen), at the rev glichen and vlichen
# take (its crates are the same at master, 6c54fa1)
lichen-contract = { git = "https://github.com/lichenbtc-org/lichen", rev = "e6532ca6435ca6ea4701ed4faac92a7011ec44bf" }
lichen-chain = { git = "https://github.com/lichenbtc-org/lichen", rev = "e6532ca6435ca6ea4701ed4faac92a7011ec44bf" }
lichen-proto = { git = "https://github.com/lichenbtc-org/lichen", rev = "e6532ca6435ca6ea4701ed4faac92a7011ec44bf" }
lichen-babe = { git = "https://github.com/lichenbtc-org/lichen", rev = "e6532ca6435ca6ea4701ed4faac92a7011ec44bf" }
lichen-hub = { git = "https://github.com/lichenbtc-org/lichen", rev = "e6532ca6435ca6ea4701ed4faac92a7011ec44bf" }
lichen-wallet = { git = "https://github.com/lichenbtc-org/lichen", rev = "e6532ca6435ca6ea4701ed4faac92a7011ec44bf" }
# the Bitcoin layer (lichenbtc-org/lichen-btc), as lichen pins it
lichen-btc = { git = "https://github.com/lichenbtc-org/lichen-btc", rev = "d7d2de04f7f8d51b44f61a68c7e1789f36502071" }
lichen-wots = { git = "https://github.com/lichenbtc-org/lichen-btc", rev = "d7d2de04f7f8d51b44f61a68c7e1789f36502071" }

# lichen's pricing (its branch `pricing`, 0224b0f: a fee by capital and
# time, HubL2::pricing), from the local worktree until it is pushed: then
# the revs above move to it and this patch goes
[patch."https://github.com/lichenbtc-org/lichen"]
lichen-contract = { path = "../lichen-pricing/crates/contract" }
lichen-chain = { path = "../lichen-pricing/crates/chain" }
lichen-proto = { path = "../lichen-pricing/crates/proto" }
lichen-babe = { path = "../lichen-pricing/crates/babe" }
lichen-hub = { path = "../lichen-pricing/crates/hub" }
lichen-wallet = { path = "../lichen-pricing/crates/wallet" }

# Dependencies (lichen's crates among them) optimised even in debug
# builds: the pre-signing, the garbling and the curve arithmetic are too
# slow at opt-level 0 for a hub to answer within a move's window in the
# tests. Our own crates stay at debug for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2
