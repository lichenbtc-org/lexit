[workspace]
resolver = "2"
exclude = ["r0"]
members = ["crates/elements", "crates/statement", "crates/proto", "crates/hub", "crates/wallet"]

[workspace.package]
# Lexit's own (its crates' versions are in the guest's ELF, so its
# image id: a change here is a new deployment)
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
bitcoin = { version = "0.32", features = ["serde"] }
bitcoincore-rpc = "0.19"
clap = { version = "4", features = ["derive"] }
# rust-elements: Liquid's transactions, addresses (blech32), confidential
# outputs (host side only: the guest reads Liquid with
# lexit-elements)
elements = "0.27"
getrandom = "0.2"
hex = "0.4"
k256 = { version = "0.13", default-features = false, features = ["alloc", "ecdsa", "schnorr", "expose-field"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
lexit-elements = { path = "crates/elements" }
lexit-statement = { path = "crates/statement" }
lexit-proto = { path = "crates/proto" }
lexit-hub = { path = "crates/hub" }
lexit-wallet = { path = "crates/wallet" }
# lichen, the base (lichenbtc-org/lichen), at master 0224b0f: its pricing
# (a fee by capital and time, HubL2::pricing)
lichen-contract = { git = "https://github.com/lichenbtc-org/lichen", rev = "0224b0f902df2c8a1a97c133c7dfa57c56c17f4b" }
lichen-chain = { git = "https://github.com/lichenbtc-org/lichen", rev = "0224b0f902df2c8a1a97c133c7dfa57c56c17f4b" }
lichen-proto = { git = "https://github.com/lichenbtc-org/lichen", rev = "0224b0f902df2c8a1a97c133c7dfa57c56c17f4b" }
lichen-babe = { git = "https://github.com/lichenbtc-org/lichen", rev = "0224b0f902df2c8a1a97c133c7dfa57c56c17f4b" }
lichen-hub = { git = "https://github.com/lichenbtc-org/lichen", rev = "0224b0f902df2c8a1a97c133c7dfa57c56c17f4b" }
lichen-wallet = { git = "https://github.com/lichenbtc-org/lichen", rev = "0224b0f902df2c8a1a97c133c7dfa57c56c17f4b" }
# the Bitcoin layer (lichenbtc-org/lichen-btc), as lichen pins it
lichen-btc = { git = "https://github.com/lichenbtc-org/lichen-btc", rev = "d7d2de04f7f8d51b44f61a68c7e1789f36502071" }
lichen-wots = { git = "https://github.com/lichenbtc-org/lichen-btc", rev = "d7d2de04f7f8d51b44f61a68c7e1789f36502071" }

# Dependencies (lichen's crates among them) optimised even in debug
# builds: the pre-signing, the garbling and the curve arithmetic are too
# slow at opt-level 0 for a hub to answer within a move's window in the
# tests. Our own crates stay at debug for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2
